name: Full suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Run runtime-stability regression suite
        run: >-
          ./scripts/run_tests.sh
          tests/test_register.py
          tests/test_profile_lifecycle.py
          tests/test_custom_provider_key.py
          tests/test_streaming_custom_provider_key.py
          tests/test_vision_custom_provider.py
          tests/test_stream_failure_notice.py
