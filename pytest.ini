[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
markers =
    integration: real network calls (live LLM). Excluded by default.
# -n auto: 195 个测试文件串行跑把 CI test job 拖到 20-64min(8/13 起),并行回到 ~2min。
# 单测/调试想关掉并行:pytest -n 0。--durations=25 让最慢测试常驻 job 日志,慢回归当场现形。
addopts = -m "not integration" -n auto --durations=25
filterwarnings =
    error::RuntimeWarning
    ignore::DeprecationWarning
