[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
markers =
    integration: real network calls (live LLM). Excluded by default.
# -n auto: 195 个测试文件串行跑把 CI test job 拖到 20-64min(8/13 起),并行回到 ~2min。
# 单测/调试想关掉并行:pytest -n 0。--durations=25 让最慢测试常驻 job 日志,慢回归当场现形。
addopts = -m "not integration" -n auto --maxprocesses=4 --dist=worksteal --durations=25
# 单测跑满 10 分钟就把该 worker 全线程栈打进 job 日志。2026-09-24 main test-full 两次被 20m job
# timeout 杀在 50% 处却看不到卡在哪个测试上——有了这条,下次 runner 再卡能直接定位。正常运行不输出。
faulthandler_timeout = 600
filterwarnings =
    error::RuntimeWarning
    ignore::DeprecationWarning
