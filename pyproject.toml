[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-multitenancy"
version = "0.1.0"
description = "Multi-tenant Feishu routing for hermes-agent — one bot, N users, N profiles"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Hermes Multitenancy Contributors"}]
requires-python = ">=3.11"
keywords = ["hermes", "feishu", "lark", "multi-tenant", "agent", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # hermes-agent provides the plugin host (PluginContext / pre_gateway_dispatch hook)
    # plus all the FeishuAdapter/MessageEvent/RoutingTable types we extend. Keep
    # this aligned with the published Hermes Agent line; 0.14.0 is the current
    # upgrade target, while 1.x has not been published yet.
    "hermes-agent>=0.14,<1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tencentcloud-sdk-python-vod>=3.0",
]

[project.urls]
Homepage = "https://github.com/eggyrooch-blip/hermes-multitenancy"
Repository = "https://github.com/eggyrooch-blip/hermes-multitenancy"
Issues = "https://github.com/eggyrooch-blip/hermes-multitenancy/issues"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "aiohttp>=3.9",
    "openpyxl>=3.1",
    "Pillow>=10",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[project.scripts]
hermes-multitenancy-sync = "hermes_multitenancy.sync.cli:main"
hermes-multitenancy-credentials = "hermes_multitenancy.credential_materializer:main"
hermes-multitenancy-analytics = "hermes_multitenancy.analytics.cli:main"
hermes-multitenancy-doctor = "hermes_multitenancy.doctor:main"
hermes-multitenancy-ingest = "hermes_multitenancy.ingest_key_admin_cli:main"
hermes-multitenancy-update-center = "hermes_multitenancy.update_center_cli:main"

[project.entry-points."hermes_agent.plugins"]
multitenancy = "hermes_multitenancy"

[tool.setuptools]
packages = ["hermes_multitenancy", "hermes_multitenancy.analytics", "hermes_multitenancy.card", "hermes_multitenancy.connectors", "hermes_multitenancy.sync"]

[tool.setuptools.package-data]
hermes_multitenancy = ["plugin.yaml"]
