# Gateway drop-in: keep the per-tenant AIAgent subprocess warm across turns.
#
# Install to: ~/.config/systemd/user/hermes-gateway.service.d/35-warm-worker.conf
# (installed by deploy/install-gateway-dropins.sh — that script is the canonical
# provisioner, because the drop-in directory is NOT in git and a host rebuild
# would otherwise silently lose this.)
#
# WHY (2026-08-19, slug mt-bg-review-daemon-killed):
# hermes-agent spawns its background skill/memory review as a DAEMON thread and
# never joins it (run_agent.py `_spawn_background_review`). That is correct for a
# long-lived process — but multitenancy runs each tenant turn inside a ONE-SHOT
# subprocess (`aiagent_subprocess.py::main()`: read stdin → run one payload →
# return → interpreter exit). Python does not wait for daemon threads at exit, so
# the review was killed milliseconds after being spawned, every time, with no
# exception and no log line.
#
# Measured on production before this drop-in: across 183 profiles with review
# activity, 1659 review model-clients were created and only 22 ever closed (1.3%);
# only 10 of those 183 profiles ever completed a single review. From 2026-08-04 on,
# every trigger was followed within 0.02–1.2s by "session scope close failed:
# scope handle is not at the top of the stack" — the foreground teardown racing
# the doomed thread.
#
# With warm workers on, the subprocess switches to `--worker` mode (a stdin request
# loop) and outlives the turn, so the review runs to completion. First verified
# success took 5m33s end to end and wrote a real skill — which is exactly why the
# one-shot path could never have worked: it exits in milliseconds.
#
# Turning this off restores the old (broken) behaviour; it is not a performance knob.
[Service]
Environment=HERMES_AIAGENT_WARM_WORKER=1
