[Service]
# startup_guard requires HERMES_HOME plus FEISHU_APP_ID,
# HERMES_MULTITENANCY_CREDENTIAL_KEY, HERMES_MULTITENANCY_RUN_BROKER_KEY and
# HERMES_MULTITENANCY_RUN_BROKER_SERVER=1 from the unit Environment/EnvironmentFile.
# On the production spinning disk the Run Broker takes well over 20s to answer
# after a restart (2026-09-24), so wait-broker waits up to 300s and systemd's
# start timeout leaves room for it.
Environment=HERMES_MULTITENANCY_RUN_BROKER_WAIT_SECONDS=300
TimeoutStartSec=400
ExecStartPre=@PYTHON@ -m hermes_multitenancy.startup_guard preflight
ExecStartPost=@PYTHON@ -m hermes_multitenancy.startup_guard wait-broker
