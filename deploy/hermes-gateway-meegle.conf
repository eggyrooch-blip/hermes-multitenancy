# Gateway drop-in: pin a FAST meegle binary for the feishu-project connector reader.
#
# Install to: ~/.config/systemd/user/hermes-gateway.service.d/45-meegle-bin.conf
# (alongside 40-run-broker.conf — the broker that calls the meegle reader lives in
# the same gateway process). Replace @REPO@ with the checked-out repo path
# (e.g. /home/hermes/code/hermes-multitenancy), then `systemctl --user daemon-reload`.
# See deploy/README-meegle.md.
#
# Gateway startup is check-only: release/provisioning installs while the old
# gateway remains online. Startup never performs network or package extraction.
#
# HERMES_MEEGLE_EXTRA_PATHS adds ~/.local/bin to _meegle_search_path()
# (credential_hub.py:530-533), so _which_meegle("meegle") finds the pinned binary
# regardless of whether the unit PATH lists ~/.local/bin. shutil.which VALIDATES
# existence+executability, so this degrades gracefully: binary present → direct
# (fast); binary missing (e.g. ExecStartPre install failed on a fresh host) →
# which returns None → reader falls back to `npx -y` (slow but correct status) —
# NOT a dead explicit path. %h = the hermes user's home.
[Service]
Environment=HERMES_MEEGLE_EXTRA_PATHS=%h/.local/bin
ExecStartPre=@REPO@/deploy/ensure-meegle.sh --check
