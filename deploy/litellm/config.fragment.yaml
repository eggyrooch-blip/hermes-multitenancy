# Mount hermes_employee_budget.py on the LiteLLM Python path before enabling.
litellm_settings:
  callbacks:
    - hermes_employee_budget.hermes_employee_budget_guard

general_settings:
  # Employees can inspect cost logs without exposing Hermes prompt/response bodies.
  store_prompts_in_spend_logs: false
  user_header_mappings:
    - header_name: X-Hermes-User-Id
      litellm_user_role: internal_user

# Required environment variables:
# HERMES_LITELLM_SHARED_KEY_HASH=<LiteLLM hash of the one Hermes shared key>
# HERMES_LITELLM_MONTHLY_BUDGET_USD=120
# HERMES_LITELLM_EMPLOYEE_EMAIL_DOMAIN=<company-domain>
# HERMES_LITELLM_RESERVATION_TTL_SECONDS=7200
# Optional, audited exception for service-only keys that are intentionally not employees:
# HERMES_LITELLM_NON_EMPLOYEE_KEY_HASHES=<comma-separated LiteLLM key hashes>
# Multitenancy side: HERMES_LITELLM_BILLING_ALLOWED_PATHS=/v1,/anthropic
# Apply migrations/001_employee_budget_spendlogs_index.sql before enabling.
