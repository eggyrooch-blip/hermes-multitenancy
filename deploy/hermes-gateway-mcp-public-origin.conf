# Gateway drop-in: the public origin the MCP OAuth callback comes back to.
#
# Install to: ~/.config/systemd/user/hermes-gateway.service.d/50-mcp-public-origin.conf
# (installed by deploy/install-gateway-dropins.sh — that script is the canonical
# provisioner, because the drop-in directory is NOT in git and a host rebuild
# would otherwise silently lose this.)
#
# WHY: the WebUI Run Broker is a sidecar inside THIS gateway process
# (start_run_broker_server(), enabled by HERMES_MULTITENANCY_RUN_BROKER_SERVER=1
# in 05-multitenancy-required.conf), and three broker paths need to tell an
# upstream authorization server where to send the browser back:
#
#   * the Figma connector      — figma_connector.resolve_redirect_uri()
#   * the connector catalog    — connector_catalog_api.connect_catalog()
#   * the Hermes MCP consent   — webui_broker_server.handle_mcp_oauth_approval()
#
# All three build "<origin>/api/auth/skill-credentials/catalog/oauth/callback"
# (or /mcp) and REFUSE to start a flow when the origin is unset — Figma rejects a
# redirect_uri that does not match the one registered at DCR time, so guessing is
# worse than failing. Unset ⇒ the Figma card answers 503 and its detail tells the
# employee to ask an admin, rather than opening a consent page that cannot land.
#
# The value must be the origin employees actually reach the WebUI on, must be
# HTTPS, and must be a bare origin (no trailing path). It has to match what the
# WebUI serves, because the callback route that receives the redirect belongs to
# the WebUI BFF, which forwards state+code back to this broker.
[Service]
Environment=HERMES_MCP_PUBLIC_ORIGIN=https://hermes.example.com
